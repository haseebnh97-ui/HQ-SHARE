<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>HQ Share</title><style>
body{margin:0;background:#0f1116;color:white;font-family:Arial;padding:20px}.app{max-width:520px;margin:auto}h1{font-size:32px}.card{background:#191c24;padding:20px;border-radius:20px;margin:18px 0}button,input{width:100%;box-sizing:border-box;padding:15px;margin:7px 0;border-radius:13px;font-size:17px}button{border:0;background:#7c5cff;color:white;font-weight:bold}input{background:#101217;color:white;border:1px solid #333}.code{text-align:center;font-size:30px;letter-spacing:5px;background:#101217;padding:15px;border-radius:13px}p,#status{color:#b5bbc9}
</style></head><body><div class="app"><h1>HQ Share</h1><p>Phone-to-phone file sharing</p>
<div class="card"><h2>Send a file</h2><button onclick="room()">Create / get my code</button><div id="mine" class="code">------</div><input id="target" maxlength="6" placeholder="Receiver code"><input id="file" type="file"><button onclick="send()">Choose file & send</button></div>
<div class="card"><h2>Receive a file</h2><p>Show your code to the sender.</p><div id="recv" class="code">------</div><div id="status">Status: Ready</div></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
let peer,me,con,incoming;
function room(){if(peer)return;me=Math.random().toString(36).slice(2,8).toUpperCase();peer=new Peer(me);peer.on('open',id=>{me=id;mine.textContent=id;recv.textContent=id;status.textContent='Status: waiting…'});peer.on('connection',c=>setup(c));}
function setup(c){con=c;c.on('open',()=>status.textContent='Status: Connected ✓');c.on('data',x=>{if(x.type==='meta'){incoming={name:x.name,size:x.size,parts:[],got:0};status.textContent='Receiving '+x.name+'…'}else if(x.type==='chunk'){incoming.parts.push(x.data);incoming.got+=x.data.byteLength;status.textContent='Receiving… '+Math.round(incoming.got/incoming.size*100)+'%';if(incoming.got>=incoming.size){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(incoming.parts));a.download=incoming.name;a.click();status.textContent='Received ✓'}}})}
async function send(){let f=file.files[0],id=target.value.trim().toUpperCase();if(!f||!id)return alert('Select a file and enter the receiver code.');if(!peer)room();setTimeout(()=>{con=peer.connect(id);con.on('open',async()=>{con.send({type:'meta',name:f.name,size:f.size});let n=65536;for(let i=0;i<f.size;i+=n){let b=await f.slice(i,i+n).arrayBuffer();con.send({type:'chunk',data:b});status.textContent='Sending… '+Math.round((i+b.byteLength)/f.size*100)+'%';await new Promise(r=>setTimeout(r,15))}status.textContent='Sent ✓'})},700)}
</script></body></html>
